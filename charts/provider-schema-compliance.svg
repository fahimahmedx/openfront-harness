<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Strict-schema conformance varied by model-provider route</title>
  <desc id="description">One hundred percent stacked bars show 45 schema violations across 368 DeepSeek V4 Flash response attempts through Baidu, compared with no violations across 344 DeepSeek response attempts through StreamLake or 338 GLM response attempts through Baidu.</desc>
  <rect width="1200" height="760" fill="#FFFFFF"/>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 750; letter-spacing: -0.7px; }
    .subtitle { font-size: 17px; fill: #64748B; }
    .route { font-size: 19px; font-weight: 750; }
    .route-detail { font-size: 14px; fill: #64748B; }
    .bar-label { font-size: 15px; font-weight: 700; }
    .legend { font-size: 14px; fill: #475569; }
    .callout-title { font-size: 16px; font-weight: 750; }
    .callout-body { font-size: 14px; fill: #475569; }
    .footer { font-size: 14px; fill: #64748B; }
  </style>

  <text class="title" x="92" y="64">Strict schema was only as reliable as the route</text>
  <text class="subtitle" x="92" y="98">Share of model response attempts conforming to the requested JSON Schema · three runs per route</text>

  <rect x="92" y="132" width="18" height="18" rx="5" fill="#169C8C"/>
  <text class="legend" x="121" y="146">Conformed to schema</text>
  <rect x="292" y="132" width="18" height="18" rx="5" fill="#E05D5D"/>
  <text class="legend" x="321" y="146">Schema violation</text>

  <text class="route" x="92" y="220">DeepSeek V4 Flash / Baidu</text>
  <text class="route-detail" x="92" y="245">368 attempts for 327 decisions · same model, prompt, schema, and reasoning setting</text>
  <defs>
    <clipPath id="baidu-bar"><rect x="92" y="266" width="1016" height="66" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#baidu-bar)">
    <rect x="92" y="266" width="892" height="66" fill="#169C8C"/>
    <rect x="984" y="266" width="124" height="66" fill="#E05D5D"/>
  </g>
  <text class="bar-label" x="538" y="306" text-anchor="middle" style="fill:#FFFFFF">323 conformed · 87.8%</text>
  <text class="bar-label" x="1046" y="306" text-anchor="middle" style="fill:#FFFFFF">45 · 12.2%</text>

  <text class="route" x="92" y="399">DeepSeek V4 Flash / StreamLake</text>
  <text class="route-detail" x="92" y="424">344 attempts for 343 decisions · only the pinned provider changed</text>
  <rect x="92" y="445" width="1016" height="66" rx="14" fill="#169C8C"/>
  <text class="bar-label" x="600" y="485" text-anchor="middle" style="fill:#FFFFFF">344 conformed · 100%</text>

  <rect x="92" y="562" width="488" height="112" rx="16" fill="#FFF4F4" stroke="#F2B8B8"/>
  <text class="callout-title" x="116" y="594" style="fill:#B4233A">What failed on the DeepSeek / Baidu route</text>
  <circle cx="120" cy="621" r="4" fill="#E05D5D"/>
  <text class="callout-body" x="134" y="626">43 strategy strings exceeded 160 characters</text>
  <circle cx="120" cy="648" r="4" fill="#E05D5D"/>
  <text class="callout-body" x="134" y="653">2 action IDs fell outside their slot enums</text>

  <rect x="604" y="562" width="504" height="112" rx="16" fill="#F0F7FF" stroke="#B9D5F5"/>
  <text class="callout-title" x="628" y="594" style="fill:#245A9A">Why this points to the exact route</text>
  <text class="callout-body" x="628" y="626">GLM-5.2 through Baidu: 338 of 338 attempts conformed</text>
  <text class="callout-body" x="628" y="653">DeepSeek through StreamLake: 344 of 344 attempts conformed</text>

  <text class="footer" x="92" y="714">Local validation caught every violation: 41 decisions retried, and 4 ultimately fell back safely to holds.</text>
  <text class="footer" x="92" y="738">A clean sample does not guarantee future conformance; it shows why the exact model-provider route must be tested and pinned.</text>
</svg>
