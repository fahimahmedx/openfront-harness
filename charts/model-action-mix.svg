<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
  <title id="title">How the evaluated models used their action slots</title>
  <desc id="description">One hundred percent stacked bars compare combat, hold, expansion, and other actions selected by GPT-5.6 Luna, GLM-5.2, and DeepSeek V4 Flash.</desc>
  <rect width="1200" height="610" fill="#FFFFFF"/>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 750; letter-spacing: -0.7px; }
    .subtitle { font-size: 17px; fill: #64748B; }
    .axis { font-size: 14px; fill: #64748B; }
    .axis-label { font-size: 15px; font-weight: 600; fill: #475569; }
    .panel-title { font-size: 18px; font-weight: 700; }
    .panel-result { font-size: 14px; fill: #64748B; }
    .legend { font-size: 14px; fill: #475569; }
    .threshold-label { fill: #9A3412; }
  </style>
  
      <text class="title" x="300" y="58">Three models, three different play styles</text>
      <text class="subtitle" x="300" y="91">Share of accepted action slots across three runs per model</text>
