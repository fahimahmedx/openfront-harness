<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">GPT-5.6 Luna win rate with and without the structured harness</title>
  <desc id="description">A three-bar chart shows zero wins in ten visual-naive trials, zero wins in ten visual-controls trials, and ten wins in ten trials with the structured harness, an observed increase from zero to one hundred percent.</desc>
  <rect width="1200" height="720" fill="#FFFFFF"/>
  <style>
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 36px; font-weight: 750; letter-spacing: -0.8px; }
    .subtitle { font-size: 18px; fill: #64748B; }
    .axis { font-size: 15px; fill: #64748B; }
    .label { font-size: 18px; font-weight: 700; }
    .detail { font-size: 15px; fill: #64748B; }
    .value { font-size: 28px; font-weight: 780; }
    .in-bar { font-size: 22px; font-weight: 760; fill: #FFFFFF; }
    .callout { font-size: 27px; font-weight: 780; fill: #4338CA; }
    .footnote { font-size: 14px; fill: #64748B; }
  </style>

  <text class="title" x="90" y="62">Win rate by agent interface</text>
  <text class="subtitle" x="90" y="96">GPT-5.6 Luna · fixed Japan eval · OpenAI provider · reasoning disabled</text>

  <rect x="873" y="35" width="237" height="72" rx="18" fill="#EEF2FF"/>
  <text class="detail" x="991.5" y="61" text-anchor="middle">Observed harness lift</text>
  <text class="callout" x="991.5" y="91" text-anchor="middle">+100 points</text>

  <line x1="120" y1="160" x2="1120" y2="160" stroke="#DDE3EC"/>
  <line x1="120" y1="260" x2="1120" y2="260" stroke="#DDE3EC"/>
  <line x1="120" y1="360" x2="1120" y2="360" stroke="#DDE3EC"/>
  <line x1="120" y1="460" x2="1120" y2="460" stroke="#DDE3EC"/>
  <line x1="120" y1="560" x2="1120" y2="560" stroke="#AEB8C6" stroke-width="1.5"/>

  <text class="axis" x="102" y="165" text-anchor="end">100%</text>
  <text class="axis" x="102" y="265" text-anchor="end">75%</text>
  <text class="axis" x="102" y="365" text-anchor="end">50%</text>
  <text class="axis" x="102" y="465" text-anchor="end">25%</text>
  <text class="axis" x="102" y="565" text-anchor="end">0%</text>

  <rect x="213" y="552" width="190" height="8" rx="4" fill="#FCE1DA"/>
  <circle cx="308" cy="556" r="8" fill="#FFFFFF" stroke="#E76F51" stroke-width="4"/>
  <text class="value" x="308" y="525" text-anchor="middle" fill="#C2412D">0/10</text>

  <rect x="505" y="552" width="190" height="8" rx="4" fill="#FCE1DA"/>
  <circle cx="600" cy="556" r="8" fill="#FFFFFF" stroke="#E76F51" stroke-width="4"/>
  <text class="value" x="600" y="525" text-anchor="middle" fill="#C2412D">0/10</text>

  <rect x="797" y="160" width="190" height="400" rx="18" fill="#5B5BD6"/>
  <text class="value" x="892" y="145" text-anchor="middle" fill="#4338CA">10/10</text>
  <text class="in-bar" x="892" y="212" text-anchor="middle">100%</text>

  <text class="label" x="308" y="604" text-anchor="middle">Visual Browser Control</text>
  <text class="detail" x="308" y="648" text-anchor="middle">10 trials</text>

  <text class="label" x="600" y="592" text-anchor="middle"><tspan x="600">Visual Browser Control</tspan><tspan x="600" dy="23">+ Game Manual</tspan></text>
  <text class="detail" x="600" y="648" text-anchor="middle">10 trials</text>

  <text class="label" x="892" y="604" text-anchor="middle">Harness</text>
  <text class="detail" x="892" y="648" text-anchor="middle">10 trials</text>

  <text class="footnote" x="1120" y="694" text-anchor="end">Observed win rate · ten trials per interface</text>
</svg>
